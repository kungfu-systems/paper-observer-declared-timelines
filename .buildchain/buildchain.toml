schema = 1

[project]
type = "publication-artifact"
name = "paper-observer-declared-timelines"

[publication]
kind = "paper"
title = "Observer-Declared Timelines for Real-World Agent Work"
version = "0.1.0-alpha.10"
abstract = "A systems design paper deriving observer-declared timelines from the Foundation Triad, with Kungfu Episodes as an implementation substrate and continuity as a second-order refinement."
authors = [ "Keren Dong" ]
primary_artifact = "_build/observer-declared-timelines.pdf"
artifact_paths = [ "_build/observer-declared-timelines.pdf" ]
metadata_paths = [ "README.md", "docs/MAP.md" ]
source_paths = [ "paper", "README.md", "LICENSE", "Makefile" ]
site_consumers = [ "papers.libkungfu.dev" ]
manifest_path = ".buildchain/publication/publication-artifact.json"
source_bundle_path = ".buildchain/publication/source.tar.gz"

[publication.archive]
id = "observer-declared-timelines"
canonical_url = "https://papers.libkungfu.dev/observer-declared-timelines/"
latest_url = "https://papers.libkungfu.dev/observer-declared-timelines/latest/"
latest_evidence_url = "https://papers.libkungfu.dev/observer-declared-timelines/latest/buildchain.release.json"
immutable_base_url = "https://papers.libkungfu.dev/archive"
registry_path = ".buildchain/publication/publication-registry.json"

[publication.toolchain]
type = "latex-docker"
image = "ghcr.io/kungfu-systems/build-images/latex-pdf-builder"
digest = "sha256:f4dc7cb0e0b23cfc2fcde663a65f36c5e71e3ae8e6477e5a24f7ad5237300f10"
command = "mkdir -p _build && cd paper && latexmk -pdf -outdir=../_build main.tex && mv ../_build/main.pdf ../_build/observer-declared-timelines.pdf"

[publish]
kind = "npm-paper-package"
package = "@kungfu-tech/paper-observer-declared-timelines"
auth = "trusted-publishing"

[version]
required = true

[[version.files]]
type = "toml"
path = ".buildchain/buildchain.toml"
key = "publication.version"

[lifecycle.install]
command = "true"

[lifecycle.verify]
command = "make check"

[next_development]
contract = "kungfu-buildchain-next-development-transition/v1"
controller_contract = "kungfu-buildchain-next-development-controller/v1"
adr = "architecture/decisions/0002-next-development-transition.md"
invariant = "A completed Alpha remains successful and its refs remain immutable while the next-development transition is incomplete."
states = ["planned","waiting-anchor","materialized","pr-pending","merged","verified"]
adapter = "scripts/next-development-transition.mjs"
adapter_environment = "BUILDCHAIN_VERSION"
source_paths = "version.files"
derived_paths = "version.derived_files"
read_only_paths = "version.manifest"
derivation_stage = "lifecycle.version-state"
verification_stage = "lifecycle.verify"
allowed_effects = ["declared-version-source-and-derived-files"]
public_side_effects = []
forbidden_ref_namespaces = ["refs/heads/alpha/", "refs/tags/"]
